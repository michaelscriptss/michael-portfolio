<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Michael Thomas</title>
  <meta name="description" content="Discord bot developer at delivrroblox.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="brand" id="brand">—</a>
      <nav class="links">
        <a href="#about">About</a>
        <a href="#work">Work</a>
        <a href="#projects">Projects</a>
        <a href="#contact" class="cta">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top">

    <!-- HERO -->
    <section class="hero">
      <div class="wrap">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-bio" id="heroBio"></p>
        <div class="hero-actions" id="heroActions"></div>
        <div class="hero-socials" id="heroSocials"></div>
      </div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="section">
      <div class="wrap">
        <h2 class="section-title">About</h2>
        <div class="about-grid">
          <img class="avatar" id="avatar" alt="" />
          <div class="about-text" id="aboutText"></div>
        </div>
      </div>
    </section>

    <!-- SKILLS -->
    <section class="section skills-section">
      <div class="wrap">
        <h2 class="section-title">Stack</h2>
        <ul class="skills" id="skills"></ul>
      </div>
    </section>

    <!-- EXPERIENCE -->
    <section id="work" class="section">
      <div class="wrap">
        <h2 class="section-title">Work</h2>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="section">
      <div class="wrap">
        <h2 class="section-title">Projects</h2>
        <div class="projects" id="projects-list"></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section contact-section">
      <div class="wrap">
        <h2 class="section-title" id="contactHeading"></h2>
        <p class="contact-text" id="contactText"></p>
        <a class="contact-btn" id="contactBtn"></a>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p id="footerNote"></p>
      <p id="footerYear"></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
